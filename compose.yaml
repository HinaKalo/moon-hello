# moon 部署编排。推送到 main 后由 moon-deployd 部署，规则见 HinaKalo/moon-infra。
x-moon:
  # 公网入口：自动获得 https://<仓库名>.moonl.cloud（端口在 moon 上需唯一，建议 18100–18999）
  upstream: 127.0.0.1:18100
  # 共享平台：自动创建本项目专属的数据库与账号，注入 DATABASE_URL / REDIS_URL
  needs: [postgres, redis]

services:
  app:
    image: ${IMAGE}
    ports:
      - "127.0.0.1:18100:8080"
    environment:
      APP_NAME: ${APP_NAME}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
